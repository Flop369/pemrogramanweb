<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            text-align: center;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 2rem;
        }
        main {
            padding: 2rem;
        }
        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome To Our Website</h1>
        <p>Select a profile below to view details</p>
    </header>

    <main>
        <div class="card-container">
            <div class="card">
                <h3>Robbi's Profile</h3>
                <p>View detailed First Profile information.</p>
                <a href="profile1.html" class="btn">Open</a>
            </div>

            <div class="card">
                <h3>Your Profile</h3>
                <p>View detailed Second Profile information.</p>
                <a href="profile2.html" class="btn">Open</a>
            </div>
        </div>
    </main>

</body>
</html>
